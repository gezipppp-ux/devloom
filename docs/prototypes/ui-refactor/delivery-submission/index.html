<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提交验证 · 三套方案</title>
<link rel="stylesheet" href="../../../../.agents/skills/neutral-workbench/assets/tokens.css">
<style>
:root{color-scheme:light;--bg:var(--ui-bg);--surface:var(--ui-surface);--subtle:var(--ui-subtle);--line:var(--ui-line-strong);--text:var(--ui-text);--muted:var(--ui-muted);--primary:var(--ui-primary);--accent:var(--ui-accent);--soft:var(--ui-accent-soft);--header:#fff}
:root[data-theme=dark]{color-scheme:dark;--bg:#141519;--surface:#1d1f27;--subtle:#262832;--line:#40424f;--text:#f2f1f6;--muted:#a5a5b2;--primary:#e9e8ef;--accent:#b6a5ff;--soft:#343047;--header:#191a20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--ui-font)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a998ed;outline-offset:2px}.review-bar{background:var(--header);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.mark{width:32px;height:32px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;border-radius:8px;font-weight:700}.brand strong{font-size:16px}.brand small{color:var(--muted)}.tabs{display:flex;gap:4px;background:var(--subtle);padding:4px;border-radius:9px}.tabs button{border:0;background:transparent;border-radius:6px;padding:8px 15px;white-space:nowrap;color:var(--muted)}.tabs button[aria-selected=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px #0002;font-weight:650}.bar-right{display:flex;align-items:center;gap:10px}.quiet{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px}.prototype-note{color:var(--muted);font-size:12px}.shell{max-width:1420px;margin:auto;padding:32px 44px 80px}.breadcrumb{color:var(--muted);font-size:13px}.back{border:0;background:none;color:var(--muted);padding:0;margin:0 0 18px}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:25px 0 26px}.title-row h1{font-size:28px;line-height:1.3;letter-spacing:-.02em;margin:0 0 7px}.title-row p{color:var(--muted);margin:0}.version-label{color:var(--accent);background:var(--soft);padding:5px 10px;border-radius:6px;font-size:12px;white-space:nowrap}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}.surface{padding:28px}.layout-a{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}.aside{border-left:1px solid var(--line);padding-left:26px}.layout-c{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}.c-context{padding:23px;align-self:start}.c-main{padding:26px 28px}.layout-b{max-width:870px}.field{display:block;margin:0 0 24px}.field>span,.field-name{display:block;font-weight:650;margin-bottom:8px}.required{color:#e37782}.field input,.field textarea,.field select,.scenario select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 12px;min-height:42px}.field textarea{min-height:210px;resize:vertical;line-height:1.65}.field select{max-width:100%}.subhead{display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin-bottom:20px}.subhead h2,.aside h2,.c-context h2{font-size:17px;margin:0}.minor{font-size:12px;color:var(--muted)}.templates{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.templates .minor{margin-right:4px}.chip{border:1px solid var(--line);border-radius:7px;background:transparent;padding:6px 10px;color:var(--muted);font-size:13px}.chip:hover{border-color:var(--accent);color:var(--text)}.chip.active{color:var(--accent);border-color:var(--accent);background:var(--soft)}.template-hint{margin:-12px 0 22px;color:var(--muted);font-size:12px}.summary-title{font-weight:650;margin:0 0 9px}.context-block{padding:14px 0;border-bottom:1px solid var(--line)}.context-block:last-child{border-bottom:0}.issue{font-weight:600;overflow-wrap:anywhere}.person{display:flex;gap:9px;align-items:center;margin-top:8px}.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;flex:none}.flow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}.flow b{color:var(--text);font-weight:600}.info-label{font-size:12px;color:var(--muted);margin-bottom:6px}.context-note{font-size:12px;color:var(--muted);margin:8px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.actions.stacked{flex-direction:column}.btn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:10px 16px;min-height:42px}.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--bg);font-weight:650}.btn-primary:disabled{opacity:.5;cursor:not-allowed}.batch{display:flex;gap:9px;align-items:flex-start;margin-top:15px}.batch input{margin-top:4px;accent-color:var(--accent)}.wide-summary{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;background:var(--subtle);border-radius:9px;padding:16px 18px;margin-bottom:25px}.wide-summary>div{min-width:0}.wide-summary .person{margin-top:0}.reviewers-list{margin:8px 0 0;padding:0;list-style:none}.reviewers-list li{font-size:13px;color:var(--muted);margin-top:7px}.scenario{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 22px;color:var(--muted);font-size:12px}.scenario select{width:auto;min-height:36px;padding:6px 30px 6px 10px}.scenario-note{font-size:12px;color:var(--muted)}.notice{padding:12px 14px;border-radius:7px;background:var(--soft);color:var(--text);margin:0 0 18px}.bottom-actions{border-top:1px solid var(--line);padding-top:4px}.right-actions{justify-content:flex-end}.view{display:none}.view.active{display:block}.c-tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:5px;background:var(--soft);color:var(--accent)}.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--bg);border-radius:8px;padding:11px 16px;box-shadow:var(--ui-shadow)}[hidden]{display:none!important}@media(max-width:900px){.shell{padding:24px 22px 70px}.layout-a,.layout-c{grid-template-columns:1fr}.aside{border-left:0;border-top:1px solid var(--line);padding:22px 0 0}.c-context{order:0}.c-main{order:1}.wide-summary{grid-template-columns:1fr;gap:13px}.review-bar{padding:12px 20px}}@media(max-width:600px){.shell{padding:20px 16px 70px}.surface,.c-main{padding:20px}.review-bar{gap:12px}.tabs{width:100%}.tabs button{flex:1;padding:8px 5px}.brand small{display:none}.title-row{margin:22px 0}.title-row h1{font-size:23px}.version-label{display:none}.actions.stacked .btn{width:100%}}
</style>
</head>
<body>
<header class="review-bar">
  <div class="brand"><span class="mark">D</span><strong>DevLoom</strong><small>送验界面方案评审</small></div>
  <nav class="tabs" aria-label="选择界面方案"><button type="button" data-view="a" aria-selected="true">A · 右侧安排</button><button type="button" data-view="b" aria-selected="false">B · 纵向填写</button><button type="button" data-view="c" aria-selected="false">C · 左侧上下文</button></nav>
  <div class="bar-right"><span class="prototype-note">原型 · 示例数据</span><button type="button" class="quiet" id="theme">切换浅色</button></div>
</header>
<main class="shell">
  <div class="breadcrumb">开发　 /　 任务详情　 /　 整理成果</div>
  <div class="title-row"><div><button class="back" type="button">← 返回会话</button><h1>提交验证</h1><p id="intro">整理本次完成的工作，提交给事项对应的验证人。</p></div><span class="version-label" id="plan-label">方案 A · 右侧安排</span></div>
  <div class="scenario"><label for="scenario">体验场景</label><select id="scenario"><option value="issue">关联事项</option><option value="multiple">多个事项</option><option value="independent">独立开发，无关联事项</option></select><span class="scenario-note">仅用于切换原型示例</span></div>
  <section id="view-a" class="view active" aria-label="方案 A 右侧安排"></section>
  <section id="view-b" class="view" aria-label="方案 B 纵向填写"></section>
  <section id="view-c" class="view" aria-label="方案 C 左侧上下文"></section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const templates = {
  standard: '完成内容：\n- \n\n验证建议：\n- ',
  concise: '已完成：\n\n请重点检查：\n',
  bug: '修复内容：\n- \n\n复现与验证：\n- '
};
const names = {a:'方案 A · 右侧安排', b:'方案 B · 纵向填写', c:'方案 C · 左侧上下文'};
let current = 'a', scenario = 'issue', title = '测试2', body = templates.standard, chosen = 'standard', reviewer = '', selectedIssue = '119';
const issueLine = '<div class="issue">#119　测试2</div>';
function reviewerBlock() {
  if (scenario === 'independent') return '<label class="field"><span>交付验证人 <i class="required">*</i></span><select data-reviewer required><option value="">选择验证人</option><option value="林悦">林悦</option><option value="陈晨">陈晨</option></select></label><p class="context-note">独立开发没有关联事项，请选择验证人。</p>';
  const name = scenario === 'multiple' && selectedIssue === '120' ? '陈晨' : '林悦';
  return '<div class="info-label">验证人 · 来自事项测试负责人</div><div class="person"><span class="avatar">'+name[0]+'</span><strong>'+name+'</strong></div><p class="context-note">根据事项及流程交接规则自动确定。</p>';
}
function issueBlock() {
  if (scenario === 'independent') return '<div class="info-label">交付来源</div><div class="issue">独立开发</div><p class="context-note">不关联事项</p>';
  return '<div class="info-label">关联事项</div>'+(scenario === 'multiple' ? '<label class="field"><select data-issue aria-label="关联事项"><option value="119" '+(selectedIssue==='119'?'selected':'')+'>#119 测试2</option><option value="120" '+(selectedIssue==='120'?'selected':'')+'>#120 上传失败提示优化</option></select></label><p class="context-note">每条事项分别填写说明并送验。</p>' : issueLine);
}
function fields() { return '<div class="subhead"><h2>成果内容</h2><span class="minor">* 为必填项</span></div><div class="field-name">交付说明 <i class="required">*</i></div><div class="templates"><span class="minor">快速填充</span><button type="button" class="chip" data-template="standard">完成与验证</button><button type="button" class="chip" data-template="concise">简洁说明</button><button type="button" class="chip" data-template="bug">问题修复</button></div><label class="field"><span class="minor">说明内容，可直接编辑</span><textarea data-body aria-label="交付说明" required></textarea></label><p class="template-hint">选择模板会替换说明内容，请结合实际结果修改。</p>'; }
function actions(stack = false) { return '<div class="actions '+(stack?'stacked':'')+'"><button type="submit" class="btn btn-primary">提交验证</button><button type="button" class="btn" data-back>返回会话</button></div>'; }
function build() {
  const flow=scenario==='independent'?'':'<div class="context-block"><div class="info-label">事项流转</div><div class="flow"><b>开发中</b> → <b>待验证</b></div></div>';
  document.querySelector('#intro').textContent=scenario==='independent'?'整理本次完成的工作，选择验证人后提交。':'整理本次完成的工作，提交给事项对应的验证人。';
  document.querySelector('#view-a').innerHTML='<form class="panel surface layout-a"><div>'+fields()+'</div><aside class="aside"><h2>送验安排</h2><div class="context-block">'+issueBlock()+'</div><div class="context-block">'+reviewerBlock()+'</div>'+flow+actions(true)+'</aside></form>';
  document.querySelector('#view-b').innerHTML='<form class="panel surface layout-b"><div class="wide-summary"><div>'+issueBlock()+'</div><div>'+reviewerBlock()+'</div>'+(scenario==='independent'?'':'<div><div class="info-label">事项流转</div><div class="flow"><b>开发中</b> → <b>待验证</b></div></div>')+'</div>'+fields()+'<div class="bottom-actions">'+actions()+'</div></form>';
  document.querySelector('#view-c').innerHTML='<form class="layout-c"><aside class="panel c-context"><span class="c-tag">送验安排</span><div class="context-block">'+issueBlock()+'</div><div class="context-block">'+reviewerBlock()+'</div>'+flow+'</aside><div class="panel c-main">'+fields()+'<div class="bottom-actions"><div class="actions right-actions"><button type="button" class="btn" data-back>返回会话</button><button type="submit" class="btn btn-primary">提交验证</button></div></div></div></form>';
  document.querySelectorAll('[data-title]').forEach(e=>e.value=title);
  document.querySelectorAll('[data-body]').forEach(e=>e.value=body);
  document.querySelectorAll('[data-reviewer]').forEach(e=>e.value=reviewer);
  document.querySelectorAll('[data-template]').forEach(e=>e.classList.toggle('active', e.dataset.template===chosen));
}
function notify(message){const el=document.querySelector('#toast'); el.textContent=message;el.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.hidden=true,2600)}
document.documentElement.dataset.theme='dark';
document.querySelector('#theme').addEventListener('click',e=>{const light=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=light?'light':'dark';e.currentTarget.textContent=light?'切换深色':'切换浅色'});
document.querySelector('#scenario').addEventListener('change',e=>{scenario=e.target.value;reviewer='';build()});
document.addEventListener('click',e=>{
  const view=e.target.closest('[data-view]');
  if(view){current=view.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b===view)));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+current));document.querySelector('#plan-label').textContent=names[current];return}
  const template=e.target.closest('[data-template]');
  if(template){chosen=template.dataset.template;body=templates[chosen];document.querySelectorAll('[data-body]').forEach(x=>x.value=body);document.querySelectorAll('[data-template]').forEach(x=>x.classList.toggle('active',x.dataset.template===chosen));return}
  if(e.target.closest('[data-back],.back'))notify('原型演示：返回会话');
});
document.addEventListener('input',e=>{if(e.target.matches('[data-title]'))title=e.target.value;if(e.target.matches('[data-body]'))body=e.target.value;if(e.target.matches('[data-reviewer]'))reviewer=e.target.value});
document.addEventListener('change',e=>{if(e.target.matches('[data-issue]')){selectedIssue=e.target.value;build()}});
document.addEventListener('submit',e=>{e.preventDefault();if(!title.trim()||!body.trim()){notify('请填写交付标题和交付说明');return}if(scenario==='independent'&&!reviewer){notify('请选择验证人');return}notify('原型演示：已提交验证，不会写入业务数据')});
build();
</script>
</body>
</html>
