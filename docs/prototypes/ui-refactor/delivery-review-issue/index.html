<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>验证交付 · 含事项详情的三套方案</title><link rel="stylesheet" href="../../../../.agents/skills/neutral-workbench/assets/tokens.css">
<style>
:root{color-scheme:dark;--bg:#141519;--surface:#1d1f27;--subtle:#272932;--line:#3c3e4a;--text:#f0eff4;--muted:#a5a5b2;--primary:#e9e8ef;--accent:#b6a5ff;--soft:#353047;--header:#191a20;--danger:#f1a0a4}
:root[data-theme=light]{color-scheme:light;--bg:var(--ui-bg);--surface:var(--ui-surface);--subtle:var(--ui-subtle);--line:var(--ui-line-strong);--text:var(--ui-text);--muted:var(--ui-muted);--primary:var(--ui-primary);--accent:var(--ui-accent);--soft:var(--ui-accent-soft);--header:#fff;--danger:#b64750}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--ui-font)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a998ed;outline-offset:2px}.top{background:var(--header);border-bottom:1px solid var(--line);padding:13px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center;font-size:16px;font-weight:700}.mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--accent);color:var(--accent);border-radius:7px}.brand small{font-size:12px;color:var(--muted);font-weight:400}.tabs{display:flex;gap:4px;background:var(--subtle);padding:4px;border-radius:8px}.tabs button{border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:6px;white-space:nowrap}.tabs button[aria-selected=true]{background:var(--surface);color:var(--text);font-weight:650;box-shadow:0 1px 4px #0003}.topright{display:flex;align-items:center;gap:12px}.topright small{color:var(--muted)}.quiet,.secondary{border:1px solid var(--line);border-radius:7px;background:transparent;padding:8px 13px}.shell{max-width:1440px;margin:auto;padding:28px 40px 80px}.crumb,.minor{color:var(--muted);font-size:13px}.back{border:0;background:none;padding:0;color:var(--muted);margin:20px 0 12px}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.page-head h1{font-size:28px;line-height:1.3;letter-spacing:-.02em;margin:0 0 6px}.page-head p{color:var(--muted);margin:0}.status{color:var(--accent);background:var(--soft);border-radius:6px;padding:5px 10px;font-size:12px;white-space:nowrap}.scenario{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin-bottom:20px;flex-wrap:wrap}.scenario select{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:7px 12px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}.box{padding:24px}.box h2,.section-title{margin:0;font-size:17px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.info-link,.select-all{border:0;background:none;color:var(--accent);padding:4px 0;font-size:13px}.content-text{line-height:1.8;overflow-wrap:anywhere}.content-text p{margin:10px 0}.content-text strong{font-size:13px}.content-text ol,.content-text ul{padding-left:21px;margin:8px 0}.detail-info{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0;color:var(--muted);font-size:12px}.detail-tag{color:var(--accent);background:var(--soft);padding:2px 7px;border-radius:5px}.context-title{font-weight:650;overflow-wrap:anywhere}.context-line{margin-top:17px}.caption{color:var(--muted);font-size:12px;margin:0 0 4px}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.flow strong{color:var(--text)}.person{display:flex;gap:8px;align-items:center}.avatar{height:26px;width:26px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--soft);font-size:12px;font-weight:700}.checklist{list-style:none;padding:0;margin:12px 0 0}.checklist li{padding:11px 0;border-bottom:1px solid var(--line)}.checklist li:last-child{border:0}.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.checklist input{accent-color:var(--accent);margin:4px 0 0;width:16px;height:16px;flex:none}.notes{display:block;margin-top:18px}.notes span{display:block;font-weight:600;margin-bottom:8px}.notes small{font-size:12px;color:var(--muted);font-weight:400}.notes textarea,.reason{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:10px 12px;resize:vertical;line-height:1.6}.notes textarea{min-height:80px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}.primary,.secondary,.return{min-height:42px;padding:9px 17px}.primary{background:var(--primary);border:1px solid var(--primary);border-radius:7px;color:var(--bg);font-weight:650}.primary:disabled{opacity:.48;cursor:not-allowed}.return{border:1px solid var(--line);background:transparent;border-radius:7px;color:var(--danger)}.hint{color:var(--muted);font-size:12px;margin:8px 0 0}.view{display:none}.view.active{display:block}.layout-a{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}.stack{display:grid;gap:16px}.layout-b .compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}.layout-b .review{margin-top:18px}.layout-c{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,520px);gap:20px;align-items:start}.layout-c .right{display:grid;gap:16px}.layout-c .side{position:sticky;top:18px}.card-header{margin-bottom:10px}.context-bar{display:flex;gap:25px;flex-wrap:wrap;padding:15px 20px;margin:0 0 18px}.context-bar>div{flex:1;min-width:160px}.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--bg);border-radius:8px;padding:11px 16px;box-shadow:var(--ui-shadow)}dialog{width:min(480px,calc(100% - 32px));padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);box-shadow:var(--ui-shadow)}dialog::backdrop{background:#0009}dialog h2{font-size:18px;margin:0}dialog .box>p{color:var(--muted);margin:8px 0 18px}dialog .actions{justify-content:flex-end}.reason{min-height:110px}dialog label{display:block;font-weight:600;margin-bottom:8px}.error{color:var(--danger);font-size:13px;margin:5px 0 0}[hidden]{display:none!important}@media(max-width:1000px){.shell{padding:22px 20px 70px}.top{padding:12px 20px}.layout-a,.layout-c,.layout-b .compare{grid-template-columns:1fr}.layout-c .side{position:static}}@media(max-width:600px){.shell{padding:18px 14px 70px}.tabs{width:100%}.tabs button{flex:1;padding:8px 4px}.brand small{display:none}.page-head h1{font-size:23px}.box{padding:18px}.actions button{flex:1}.page-head{margin-bottom:18px}}
</style></head><body>
<header class="top"><div class="brand"><span class="mark">D</span>DevLoom <small>交付验证方案评审</small></div><nav class="tabs" aria-label="选择界面方案"><button type="button" data-view="a" aria-selected="true">A · 上下核验</button><button type="button" data-view="b" aria-selected="false">B · 并排对照</button><button type="button" data-view="c" aria-selected="false">C · 事项为主</button></nav><div class="topright"><small>原型 · 示例数据</small><button id="theme" class="quiet" type="button">切换浅色</button></div></header>
<main class="shell"><div class="crumb">交付　/　交付详情</div><button class="back" type="button">← 返回交付</button><div class="page-head"><div><h1 id="title">客户列表支持跨页筛选与导出</h1><p>对照事项与交付内容，记录验证结果。</p></div><span class="status">待验证</span></div><div class="scenario"><label for="scenario">体验场景</label><select id="scenario"><option value="requirement">需求</option><option value="bug">Bug</option></select><span>用于查看不同类型事项的详情</span></div><section class="view active" id="view-a" aria-label="方案 A"></section><section class="view" id="view-b" aria-label="方案 B"></section><section class="view" id="view-c" aria-label="方案 C"></section></main>
<dialog id="return-dialog" aria-labelledby="return-title"><div class="box"><h2 id="return-title">退回修改</h2><p>请告诉提交人需要调整什么，退回后事项进入待返工。</p><label for="reason">退回原因 <span style="color:var(--danger)">*</span></label><textarea id="reason" class="reason" placeholder="例如：筛选后导出的数据与页面显示不一致。" maxlength="4000"></textarea><p class="error" id="reason-error" hidden>请填写退回原因。</p><div class="actions"><button type="button" class="secondary" id="cancel-return">取消</button><button type="button" class="return" id="confirm-return">确认退回</button></div></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
const examples={requirement:{type:'需求',id:'119',title:'客户列表支持跨页筛选与导出',description:'运营人员需要在客户列表中组合筛选条件，翻页后保留选择，并导出当前筛选范围内的数据。',detail:'<p><strong>业务背景</strong></p><p>目前翻页后筛选条件会丢失，导出结果也无法确认是否与列表一致。</p>',criteria:['筛选条件支持跨页保留','导出结果与当前筛选一致','筛选无结果时有明确提示'],delivery:'<p><strong>完成内容</strong></p><p>新增跨页筛选与条件保留；导出使用当前筛选条件。</p><p><strong>验证建议</strong></p><p>检查跨页切换和筛选后导出的结果。</p>'},bug:{type:'Bug',id:'120',title:'筛选后导出文件与页面结果不一致',description:'客户列表筛选后，导出的文件包含未匹配筛选条件的数据。',detail:'<p><strong>复现步骤</strong></p><ol><li>进入客户列表，选择地区筛选条件。</li><li>确认列表只显示该地区的客户。</li><li>点击导出并打开生成文件。</li></ol><p><strong>预期结果</strong>　导出内容与当前筛选范围一致。</p><p><strong>实际结果</strong>　导出文件包含其他地区的客户。</p>',criteria:['筛选导出的数据与列表范围一致','清除筛选后可导出完整列表','无匹配结果时不会导出多余数据'],delivery:'<p><strong>修复内容</strong></p><p>修复导出请求未携带筛选条件的问题。</p><p><strong>验证建议</strong></p><p>按复现步骤检查筛选导出，并验证清除筛选后的导出。</p>'}};
let scenario='requirement',note='',timer;const checked=new Set();
function issue(){const d=examples[scenario];return '<div class="section-head"><h2>事项详情</h2><button type="button" class="info-link" data-issue>查看完整事项 ↗</button></div><div class="detail-info"><span class="detail-tag">'+d.type+'</span><span>#'+d.id+'</span><span>优先级：普通</span><span>业务负责人：陈晨</span></div><div class="content-text"><p><strong>描述</strong></p><p>'+d.description+'</p>'+d.detail+'</div>'}
function delivery(){return '<h2>交付说明</h2><div class="content-text">'+examples[scenario].delivery+'</div>'}
function context(){const d=examples[scenario];return '<div class="context-line"><p class="caption">关联事项</p><div class="context-title">#'+d.id+' '+d.title+'</div></div><div class="context-line"><p class="caption">验证人</p><div class="person"><span class="avatar">林</span>林悦</div></div><div class="context-line"><p class="caption">发布人</p><div>陈晨</div></div><div class="context-line"><p class="caption">验证后的流转</p><div class="flow"><strong>通过</strong> 已实现 <span>·</span> <strong>退回</strong> 待返工</div></div>'}
function review(){return '<div class="section-head"><h2 class="section-title">事项验收标准</h2><button type="button" class="select-all">一键全选</button></div><ul class="checklist">'+examples[scenario].criteria.map((item,i)=>'<li><label><input type="checkbox" data-check="'+i+'"><span>'+item+'</span></label></li>').join('')+'</ul><label class="notes"><span>验证说明 <small>（选填）</small></span><textarea data-note placeholder="可补充验证结果，无需填写也可通过。"></textarea></label><div class="actions"><button type="button" class="primary" data-approve disabled>验证通过</button><button type="button" class="return" data-return>退回修改</button></div><p class="hint" data-progress>已核对 0 / 3 项，通过前需核对全部验收项。</p>'}
function build(){document.querySelector('#title').textContent=examples[scenario].title;document.querySelector('#view-a').innerHTML='<div class="layout-a"><div class="stack"><section class="panel box">'+issue()+'</section><section class="panel box">'+delivery()+'</section><section class="panel box">'+review()+'</section></div><aside class="panel box"><h2>交付信息</h2>'+context()+'</aside></div>';document.querySelector('#view-b').innerHTML='<div class="panel context-bar"><div><p class="caption">关联事项</p><strong>#'+examples[scenario].id+' '+examples[scenario].title+'</strong></div><div><p class="caption">验证人</p><div class="person"><span class="avatar">林</span>林悦</div></div><div><p class="caption">验证后</p><div class="flow"><strong>通过</strong> 已实现 <span>·</span> <strong>退回</strong> 待返工</div></div></div><div class="layout-b"><div class="compare"><section class="panel box">'+issue()+'</section><section class="panel box">'+delivery()+'</section></div><section class="panel box review">'+review()+'</section></div>';document.querySelector('#view-c').innerHTML='<div class="layout-c"><section class="panel box">'+issue()+'</section><div class="right"><section class="panel box">'+delivery()+'</section><section class="panel box side">'+review()+'</section><section class="panel box"><h2>交付信息</h2>'+context()+'</section></div></div>';sync()}
function sync(){document.querySelectorAll('[data-check]').forEach(el=>el.checked=checked.has(Number(el.dataset.check)));document.querySelectorAll('[data-note]').forEach(el=>{if(document.activeElement!==el)el.value=note});document.querySelectorAll('[data-approve]').forEach(el=>el.disabled=checked.size!==examples[scenario].criteria.length);document.querySelectorAll('[data-progress]').forEach(el=>el.textContent='已核对 '+checked.size+' / '+examples[scenario].criteria.length+' 项，通过前需核对全部验收项。');document.querySelectorAll('.select-all').forEach(el=>el.textContent=checked.size===examples[scenario].criteria.length?'取消全选':'一键全选')}
function show(text){const el=document.querySelector('#toast');el.textContent=text;el.hidden=false;clearTimeout(timer);timer=setTimeout(()=>el.hidden=true,3000)}
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){const id=Number(e.target.dataset.check);e.target.checked?checked.add(id):checked.delete(id);sync()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){note=e.target.value;sync()}});
document.addEventListener('click',e=>{let view=e.target.closest('[data-view]');if(view){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b===view)));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view.dataset.view));sync();return}if(e.target.closest('.select-all')){if(checked.size===examples[scenario].criteria.length)checked.clear();else examples[scenario].criteria.forEach((_,i)=>checked.add(i));sync();return}if(e.target.closest('[data-return]')){document.querySelector('#reason-error').hidden=true;document.querySelector('#return-dialog').showModal();return}if(e.target.closest('[data-approve]')){show('原型演示：已验证通过，不会写入业务数据');return}if(e.target.closest('[data-issue],.back'))show('原型演示：打开关联事项')});
document.querySelector('#scenario').addEventListener('change',e=>{scenario=e.target.value;checked.clear();note='';build()});
document.querySelector('#cancel-return').addEventListener('click',()=>document.querySelector('#return-dialog').close());
document.querySelector('#confirm-return').addEventListener('click',()=>{if(!document.querySelector('#reason').value.trim()){document.querySelector('#reason-error').hidden=false;return}document.querySelector('#return-dialog').close();show('原型演示：已退回修改，不会写入业务数据')});
document.querySelector('#theme').addEventListener('click',e=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'';e.currentTarget.textContent=light?'切换深色':'切换浅色'});
build();
</script></body></html>
