<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合并开发 · 逐项交付方案</title><link rel="stylesheet" href="../../../../.agents/skills/neutral-workbench/assets/tokens.css"><style>
:root{color-scheme:dark;--bg:#141519;--surface:#1d1f27;--subtle:#252730;--line:#3b3d49;--text:#f0eff4;--muted:#a5a5b2;--primary:#e9e8ef;--accent:#b6a5ff;--soft:#353047;--header:#191a20}
:root[data-theme=light]{color-scheme:light;--bg:var(--ui-bg);--surface:var(--ui-surface);--subtle:var(--ui-subtle);--line:var(--ui-line-strong);--text:var(--ui-text);--muted:var(--ui-muted);--primary:var(--ui-primary);--accent:var(--ui-accent);--soft:var(--ui-accent-soft);--header:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--ui-font)}button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #a998ed;outline-offset:2px}.topbar{background:var(--header);border-bottom:1px solid var(--line);padding:13px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.mark{width:30px;height:30px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;border-radius:7px}.brand small{font-size:12px;color:var(--muted);font-weight:400}.tabs{display:flex;gap:4px;background:var(--subtle);padding:4px;border-radius:8px}.tabs button{border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:6px;white-space:nowrap}.tabs button[aria-selected=true]{background:var(--surface);color:var(--text);font-weight:650;box-shadow:0 1px 4px #0003}.right{display:flex;align-items:center;gap:10px}.right small{color:var(--muted)}.quiet,.secondary{border:1px solid var(--line);border-radius:7px;background:transparent;padding:8px 13px}.shell{max-width:1360px;margin:auto;padding:28px 40px 80px}.crumb{color:var(--muted);font-size:13px}.back{margin-top:20px;color:var(--muted);border:0;background:none;padding:0}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:14px 0 20px}.heading h1{font-size:28px;line-height:1.3;margin:0 0 6px;letter-spacing:-.02em}.heading p{margin:0;color:var(--muted)}.badge{color:var(--accent);background:var(--soft);padding:4px 10px;border-radius:6px;font-size:12px}.context{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:0 0 22px;color:var(--muted)}.context strong{color:var(--text)}.context .separator{color:var(--line)}.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface)}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 24px;border-bottom:1px solid var(--line)}.intro h2{font-size:17px;margin:0}.intro p{color:var(--muted);margin:3px 0 0;font-size:13px}.count{background:var(--subtle);color:var(--muted);padding:4px 9px;border-radius:6px;white-space:nowrap;font-size:12px}.items{padding:0 24px}.item{padding:23px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}.issue-title{font-size:16px;font-weight:650;overflow-wrap:anywhere}.issue-no{color:var(--muted);font-weight:400;margin-right:8px}.assignee{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px;white-space:nowrap}.avatar{display:inline-grid;place-items:center;width:25px;height:25px;background:var(--soft);color:var(--accent);border-radius:50%;font-size:12px;font-weight:700}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}.label{font-weight:650;margin-right:6px}.required{color:#ed858f}.chip{background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--muted);font-size:12px}.chip:hover{color:var(--text);border-color:var(--accent)}textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:10px 12px;resize:vertical;line-height:1.6;min-height:115px}.hint{color:var(--muted);font-size:12px;margin:6px 0 0}.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:19px 24px;border-top:1px solid var(--line)}.actions p{color:var(--muted);font-size:13px;margin:0}.action-buttons{display:flex;gap:10px}.primary,.secondary{min-height:42px;padding:9px 17px}.primary{background:var(--primary);border:1px solid var(--primary);border-radius:7px;color:var(--bg);font-weight:650}.secondary{background:none}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}.card{padding:21px;display:flex;flex-direction:column;gap:15px}.card .item-head{margin:0}.card .controls{margin-bottom:8px}.card textarea{min-height:165px}.cards-footer{border-top:0}.layout-c .item{display:grid;grid-template-columns:minmax(180px,260px) minmax(0,1fr);gap:24px}.layout-c .item-head{display:block;margin:0}.layout-c .assignee{margin-top:9px}.layout-c textarea{min-height:105px}.errors{color:#e9949a;font-size:13px;margin:0 0 12px}.summary{color:var(--muted);font-size:13px}.notice{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);border-radius:8px;padding:12px 16px;box-shadow:var(--ui-shadow)}[hidden]{display:none!important}@media(max-width:900px){.shell{padding:22px 20px 70px}.topbar{padding:12px 20px}.cards{grid-template-columns:1fr}.layout-c .item{grid-template-columns:1fr;gap:12px}}@media(max-width:600px){.shell{padding:18px 14px 70px}.tabs{width:100%}.tabs button{flex:1;padding:8px 4px}.brand small{display:none}.heading h1{font-size:23px}.intro,.actions{padding:16px}.items{padding:0 16px}.item-head{flex-wrap:wrap}.card{padding:17px}.action-buttons{width:100%;flex-direction:column-reverse}.action-buttons button{width:100%}}
</style></head><body>
<header class="topbar"><div class="brand"><span class="mark">D</span>DevLoom <small>合并开发交付方案评审</small></div><nav class="tabs" aria-label="选择界面方案"><button data-view="a" aria-selected="true">A · 纵向分组</button><button data-view="b" aria-selected="false">B · 并排卡片</button><button data-view="c" aria-selected="false">C · 事项行</button></nav><div class="right"><small>原型 · 示例数据</small><button class="quiet" id="theme">切换浅色</button></div></header>
<main class="shell"><div class="crumb">开发　/　任务详情　/　整理成果</div><button class="back" type="button">← 返回会话</button><div class="heading"><div><h1>提交验证</h1><p>同一开发任务中的事项分别填写，一次提交后各自进入验证。</p></div><span class="badge" id="variant">方案 A · 纵向分组</span></div><div class="context"><span>开发任务</span><strong>客户搜索与上传问题</strong><span class="separator">|</span><span>3 个事项待送验</span></div>
<section id="view-a" class="view active" aria-label="方案 A"></section><section id="view-b" class="view" aria-label="方案 B"></section><section id="view-c" class="view" aria-label="方案 C"></section></main><div id="toast" class="notice" role="status" hidden></div>
<script>
const items=[{id:'119',title:'客户列表支持跨页筛选与导出',person:'林悦',body:'完成内容：\n- \n\n验证建议：\n- '},{id:'120',title:'修复上传失败后没有提示的问题',person:'陈晨',body:'修复内容：\n- \n\n复现与验证：\n- '},{id:'121',title:'保存筛选条件并恢复上次选择',person:'林悦',body:'完成内容：\n- \n\n验证建议：\n- '}];
const templates={standard:'完成内容：\n- \n\n验证建议：\n- ',brief:'已完成：\n\n请重点检查：\n',bug:'修复内容：\n- \n\n复现与验证：\n- '};
const labels={a:'方案 A · 纵向分组',b:'方案 B · 并排卡片',c:'方案 C · 事项行'};
function heading(item){return '<div class="item-head"><div class="issue-title"><span class="issue-no">#'+item.id+'</span>'+item.title+'</div><div class="assignee">验证人 <span class="avatar">'+item.person[0]+'</span><strong>'+item.person+'</strong></div></div>'}
function editor(item){return '<div><div class="controls"><span class="label">交付说明 <span class="required">*</span></span><button class="chip" type="button" data-fill="standard" data-id="'+item.id+'">完成与验证</button><button class="chip" type="button" data-fill="brief" data-id="'+item.id+'">简洁说明</button><button class="chip" type="button" data-fill="bug" data-id="'+item.id+'">问题修复</button></div><textarea aria-label="'+item.title+'的交付说明" data-body="'+item.id+'" required></textarea><p class="hint">选择模板会替换此事项的说明，请按实际结果修改。</p></div>'}
function footer(){return '<div class="actions"><p>将分别生成 3 条交付，交给各事项的验证人。</p><div class="action-buttons"><button type="button" class="secondary" data-back>返回会话</button><button type="submit" class="primary">提交全部验证</button></div></div>'}
function build(){document.querySelector('#view-a').innerHTML='<form class="panel"><div class="intro"><div><h2>逐项填写交付说明</h2><p>每条事项拥有自己的交付记录和验证人。</p></div><span class="count">3 项待送验</span></div><div class="items">'+items.map(item=>'<section class="item">'+heading(item)+editor(item)+'</section>').join('')+'</div>'+footer()+'</form>';
document.querySelector('#view-b').innerHTML='<form><div class="cards">'+items.map(item=>'<section class="panel card">'+heading(item)+editor(item)+'</section>').join('')+'</div><div class="panel cards-footer">'+footer()+'</div></form>';
document.querySelector('#view-c').innerHTML='<form class="panel layout-c"><div class="intro"><div><h2>事项与交付说明</h2><p>逐条填写，提交后分别进入各自的验证流程。</p></div><span class="count">3 项待送验</span></div><div class="items">'+items.map(item=>'<section class="item">'+heading(item)+editor(item)+'</section>').join('')+'</div>'+footer()+'</form>';
document.querySelectorAll('[data-body]').forEach(field=>field.value=items.find(item=>item.id===field.dataset.body).body)}
let timer;function show(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.hidden=false;clearTimeout(timer);timer=setTimeout(()=>toast.hidden=true,3000)}
document.addEventListener('input',e=>{if(e.target.matches('[data-body]')){const id=e.target.dataset.body;items.find(i=>i.id===id).body=e.target.value;document.querySelectorAll('[data-body="'+id+'"]').forEach(field=>{if(field!==e.target)field.value=e.target.value})}});
document.addEventListener('click',e=>{const button=e.target.closest('[data-view]');if(button){document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-selected',String(x===button)));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+button.dataset.view));document.querySelector('#variant').textContent=labels[button.dataset.view];return}const fill=e.target.closest('[data-fill]');if(fill){const item=items.find(i=>i.id===fill.dataset.id);item.body=templates[fill.dataset.fill];document.querySelectorAll('[data-body="'+item.id+'"]').forEach(field=>field.value=item.body);return}if(e.target.closest('[data-back],.back'))show('原型演示：返回会话')});
document.addEventListener('submit',e=>{e.preventDefault();const invalid=items.find(item=>!item.body.trim());if(invalid){show('请填写 #'+invalid.id+' 的交付说明');return}show('原型演示：已分别提交 3 条交付，不会写入业务数据')});
document.querySelector('#theme').addEventListener('click',e=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'';e.currentTarget.textContent=light?'切换深色':'切换浅色'});
build();
</script></body></html>
