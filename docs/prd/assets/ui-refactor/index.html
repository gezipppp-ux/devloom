er":3,"id":"workflow","title":"全局事项流程","size":"1536x1024","file":"pages/09-workflow.webp"},{"number":4,"id":"suppliers","title":"Agent 供应商","size":"1536x1024","file":"pages/09-suppliers.webp"}]},{"id":"10","name":"运行平台与系统配置","subtitle":"连接、环境、存储与初始化记录分别维护","board":"10-overview.webp","pages":[{"number":1,"id":"supplier-editor","title":"供应商连接编辑","size":"1536x1024","file":"pages/10-supplier-editor.webp"},{"number":2,"id":"environment","title":"运行环境检测","size":"1536x1024","file":"pages/10-environment.webp"},{"number":3,"id":"storage","title":"成员目录设置","size":"1536x1024","file":"pages/10-storage.webp"},{"number":4,"id":"initialization-record","title":"初始化记录","size":"1536x1024","file":"pages/10-initialization-record.webp"}]},{"id":"11","name":"账号与首次使用","subtitle":"登录、改密、初始化与确认形成独立引导","board":"11-overview.webp","pages":[{"number":1,"id":"login","title":"登录","size":"1536x1024","file":"pages/11-login.webp"},{"number":2,"id":"password","title":"首次修改密码","size":"1536x1024","file":"pages/11-password.webp"},{"number":3,"id":"setup-wizard","title":"首次初始化向导","size":"1536x1024","file":"pages/11-setup-wizard.webp"},{"number":4,"id":"setup-summary","title":"初始化确认与就绪","size":"1536x1024","file":"pages/11-setup-summary.webp"}]},{"id":"12","name":"冲突、异常与移动端","subtitle":"保留草稿与上下文，窄屏仍可完成完整操作","board":"12-overview.webp","pages":[{"number":1,"id":"edit-conflict","title":"编辑冲突处理","size":"1536x1024","file":"pages/12-edit-conflict.webp"},{"number":2,"id":"uncertain-operation","title":"异常与结果待确认","size":"1536x1024","file":"pages/12-uncertain-operation.webp"},{"number":3,"id":"mobile-home","title":"移动端统一工作台","size":"1024x1536","file":"pages/12-mobile-home.webp"},{"number":4,"id":"mobile-issue","title":"移动端事项与验收","size":"1024x1536","file":"pages/12-mobile-issue.webp"}]}]}</script><script>
const data=JSON.parse(document.getElementById("manifest").textContent);const grid=document.getElementById("grid"),group=document.getElementById("group"),search=document.getElementById("search"),viewer=document.getElementById("viewer"),viewport=document.getElementById("viewport"),full=document.getElementById("full");let mode="boards",items=[],selected=0;for(const g of data.groups){const o=document.createElement("option");o.value=g.id;o.textContent=g.id+" · "+g.name;group.append(o)}function display(index){selected=(index+items.length)%items.length;const item=items[selected];full.src=item.file;full.alt=item.title;document.getElementById("viewer-title").textContent=item.title;document.getElementById("original").href=item.file;viewport.classList.remove("zoom");document.getElementById("zoom").textContent="原始尺寸";viewport.scrollTop=0;viewport.scrollLeft=0}function open(index){display(index);viewer.showModal()}function render(){const q=search.value.trim().toLowerCase();items=[];for(const g of data.groups){if(group.value!=="all"&&g.id!==group.value)continue;if(mode==="boards"){if(q&&!(g.name+g.subtitle+g.pages.map(p=>p.title).join(" ")).toLowerCase().includes(q))continue;items.push({title:g.id+" · "+g.name,description:g.subtitle,file:g.board})}else{for(const p of g.pages){if(q&&!(g.name+p.title).toLowerCase().includes(q))continue;items.push({title:g.id+"."+p.number+" · "+p.title,description:g.name,file:p.file})}}}grid.replaceChildren();grid.className="grid"+(mode==="pages"?" pages":"");items.forEach((item,i)=>{const article=document.createElement("article");article.className="card";const button=document.createElement("button");button.className="image-button";button.setAttribute("aria-label","放大："+item.title);const img=document.createElement("img");img.src=item.file;img.alt=item.title;img.loading="lazy";button.append(img);button.addEventListener("click",()=>open(i));const caption=document.createElement("div");caption.className="caption";const h=document.createElement("h2");h.textContent=item.title;const p=document.createElement("p");p.textContent=item.description;const a=document.createElement("a");a.href=item.file;a.target="_blank";a.rel="noopener";a.textContent="打开原图 ↗";caption.append(h,p,a);article.append(button,caption);grid.append(article)});document.getElementById("count").textContent=items.length+" 张";document.getElementById("empty").hidden=items.length>0;document.getElementById("boards-mode").setAttribute("aria-pressed",String(mode==="boards"));document.getElementById("pages-mode").setAttribute("aria-pressed",String(mode==="pages"))}document.getElementById("boards-mode").onclick=()=>{mode="boards";render()};document.getElementById("pages-mode").onclick=()=>{mode="pages";render()};group.onchange=render;search.oninput=render;document.getElementById("close").onclick=()=>viewer.close();document.getElementById("previous").onclick=()=>display(selected-1);document.getElementById("next").onclick=()=>display(selected+1);document.getElementById("zoom").onclick=()=>{viewport.classList.toggle("zoom");document.getElementById("zoom").textContent=viewport.classList.contains("zoom")?"适应窗口":"原始尺寸"};viewer.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();display(selected+1)}if(e.key==="ArrowLeft"){e.preventDefault();display(selected-1)}});render();
</script></body></html>
